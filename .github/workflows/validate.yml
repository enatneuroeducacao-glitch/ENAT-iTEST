name: Validate ENAT iTEST

on:
  push:
    branches: ["main", "feat/national-assessment-platform"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f assets/portal.css
          test -f assets/portal.js
          test -f assets/supabase-config.js
          test -f assets/question-import-core.js
          test -f supabase/functions/enat-itest-api/index.ts
          test -f supabase/migrations/20261104180000_initial_national_assessment_platform.sql
          test -f docs/PLATAFORMA-AVALIACAO-NACIONAL.md
          test -f docs/HSI-DOTH-P-PILOTO.md
          test -f supabase/migrations/20261105112105_hsi_pilot_likert_instrument_v1.sql
          test -f supabase/migrations/20261105112223_hsi_pilot_fix_dimension_score_aggregation.sql
          test -f supabase/migrations/20261105112257_hsi_pilot_explicit_deny_policies_and_fk_index.sql
      - name: Check JavaScript syntax
        run: |
          node --check assets/portal.js
          node --check assets/supabase-config.js
          node --check assets/question-import-core.js
          node --check tests/smoke-test.js
      - name: Run smoke tests
        run: node tests/smoke-test.js
